language: python

jobs:
  include:
    - name: "Python 3.6.10 on Bionic Linux"
      os: linux
      python: "3.6.10"
    - name: "Python 3.7.6 on Bionic Linux"
      os: linux
      python: "3.7.6"
    - name: "Python 3.8.1 on Bionic Linux"
      os: linux
      python: "3.8.1"
    - name: "Python 3.6.10 on Windows"
      os: windows
      language: shell
      before_install:
        - choco install python --version 3.6.10
        - python -m pip install --upgrade pip
      env: PATH=/c/Python36:/c/Python36/Scripts:$PATH
    - name: "Python 3.7.6 on Windows"
      os: windows
      language: shell
      before_install:
        - choco install python --version 3.7.6
        - python -m pip install --upgrade pip
      env: PATH=/c/Python37:/c/Python37/Scripts:$PATH
    - name: "Python 3.8.1 on Windows"
      os: windows
      language: shell
      before_install:
        - choco install python --version 3.8.1
        - python -m pip install --upgrade pip
      env: PATH=/c/Python38:/c/Python38/Scripts:$PATH

install:
  - pip3 install --upgrade pip
  - pip3 install -r requirements.txt

script:
  - python3 tests/basic_test.py || python tests/basic_test.py
